name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # CI currently tests source; this verifies the packed artifact so a
      # broken pack fails the PR, not only the v* tag. Match release.yml:
      # call the script directly (`npm run verify:package` rebuilds).
      - run: node scripts/verify-package.mjs
